<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fce8f5"><title>PetalDose · peptide planner</title><style>
:root{--cream:#fff7fb;--blush:#ffe6f3;--rose:#f7d1e8;--lilac:#efd9ff;--lav:#d8b9f5;--amethyst:#b68ce0;--purple:#79509b;--ink:#513c61;--muted:#8b7597;--border:#eecfe9;--shadow:0 5px 15px #a26da32b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff7fb,#f9f0ff);color:var(--ink);font:14px system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(155deg,#fffafd,#f9f0ff);padding-bottom:90px;box-shadow:0 0 35px #a17bad19}.hero{position:relative;background:#fbe6f5}.hero img{display:block;width:100%;height:auto}.hero .mini-title{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);display:flex;background:#fff8fdf5;backdrop-filter:blur(16px);border-top:2px solid #edcbea;z-index:20;padding:6px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #a877a51c}.nav button{flex:1;min-width:0;border:0;background:transparent;color:#8d71a2;padding:7px 1px;border-radius:14px;font-size:11px;font-weight:650}.nav button .ico{display:block;font-size:22px;line-height:25px;margin-bottom:3px}.nav button.active{background:linear-gradient(135deg,#f9d6ee,#e5cafa);color:#75419d;box-shadow:inset 0 0 0 1px #dfb9eb}.content{padding:16px 14px 26px}.greeting{background:linear-gradient(125deg,#fff4fa,#f2e3fc);border:2px solid #efcfe9;border-radius:22px;padding:16px 18px;position:relative;box-shadow:var(--shadow);margin-bottom:15px;overflow:hidden}.greeting:before{content:'୨୧';position:absolute;right:16px;top:6px;color:#d5a3d6;font-size:31px}.greeting h1{font-family:Georgia,serif;font-size:26px;font-style:italic;margin:0;color:#8451a0}.greeting p{margin:5px 0 0;color:#8e7398;font-size:12px}.editnick{border:1px solid #dfb9df;border-radius:50%;background:#fff9ff;color:#8e62a9;padding:5px 8px;vertical-align:middle}.lace{height:11px;background:radial-gradient(circle at 12px -3px,transparent 14px,#e9b9db 14.5px,#e9b9db 15px,transparent 15.5px) repeat-x;background-size:24px 14px;opacity:.7;margin-bottom:8px}.page-title{font-family:Georgia,serif;font-size:24px;color:#79499a;margin:8px 0 4px}.subtitle{font-size:12px;color:var(--muted);margin:0 0 14px}.panel{background:#fffafd;border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:15px;margin-bottom:14px}.panel h2{font-family:Georgia,serif;font-size:18px;color:#7d4fa1;margin:0 0 11px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px;background:linear-gradient(130deg,#fff7fc,#f2e6ff);border:1px solid #e9cdec;border-radius:17px;box-shadow:0 3px 8px #ad87ad17}.stat b{display:block;font-size:24px;color:#8552a8}.stat span{color:#846e91;font-size:11px}.stat .orn{font-size:19px;color:#d788bc}.btn{background:linear-gradient(115deg,#f1a5cf,#b995e8);border:1px solid #e4a9d7;border-radius:999px;color:white;padding:10px 15px;font-weight:700;box-shadow:0 3px 8px #ba86bb30}.btn.secondary{background:linear-gradient(#fffaff,#f8eafc);color:#8a5baa;border-color:#e5c5e7;box-shadow:0 2px 5px #b689ad18}.btn.warn{background:#fff1f4;color:#b45075;border-color:#eec7d5}.btn.small{font-size:12px;padding:7px 11px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.pill{font-size:11px;background:#f2e3fc;border:1px solid #e2c6ee;color:#8256a1;padding:4px 9px;border-radius:99px}.pill.done{background:#e9f5e8;border-color:#d2e8cf;color:#4f8050}.pill.skip{background:#fff0e3;border-color:#f4d7c1;color:#a67b50}.entry{border:1px solid #eed3e8;border-radius:16px;padding:12px;margin-top:10px;background:white}.entry strong{font-size:15px}.entry small{display:block;color:var(--muted);margin:5px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.month{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#ffedf8,#eedbff);padding:8px;border:1px solid #e9c9e9;border-radius:18px;margin-bottom:10px}.month strong{font-family:Georgia,serif;font-size:20px;color:#784796}.month button{border:1px solid #e4b6e6;background:#fff7fc;border-radius:50%;width:33px;height:33px;color:#8454a6;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;color:#967a9d;font-size:10px}.day{min-width:0;min-height:65px;background:#fff;border:1px solid #ecd1e6;border-radius:10px;padding:4px;text-align:left;color:#6c507f}.day.selected{background:#f0e0ff;border-color:#b68adf;box-shadow:inset 0 0 0 1px #b68adf}.day.other{opacity:.35}.day .num{font-size:11px;font-weight:750}.dot{display:block;height:5px;border-radius:6px;background:#d58dc3;margin:3px 0}.dot:nth-child(odd){background:#a58cda}.day em{font-style:normal;font-size:9px;color:#936da8}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#735783;font-weight:650}.field input,.field select{border:1px solid #e7c9e4;border-radius:11px;background:#fff;padding:10px;width:100%;color:#493454;min-width:0}.full{grid-column:1/-1}.note{font-size:12px;color:#826f8b;background:#f8edff;border:1px solid #ead5f2;border-radius:12px;padding:11px;margin:10px 0}.empty{text-align:center;color:#967f9c;padding:24px 10px;border:1px dashed #e6c8e7;border-radius:13px}.progress{height:9px;border-radius:15px;background:#f0e4f4;overflow:hidden;margin:9px 0}.progress div{height:100%;background:linear-gradient(90deg,#efa2ce,#ad86e1)}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-grid>div{background:#f8efff;border-radius:12px;padding:10px;font-size:11px;color:#866c93}.mini-grid b{font-size:17px;display:block;color:#79509b}.separator{border:0;border-top:1px dashed #e7c7e6;margin:13px 0}.scroll-tabs{display:flex;overflow:auto;gap:6px;margin-bottom:13px}.scroll-tabs button{white-space:nowrap}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:8px 4px;text-align:left;border-bottom:1px solid #f0ddee}.table-wrap{overflow:auto}.stock-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0dcec;padding:10px 0}.stock-line:last-child{border-bottom:0}.more-links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.more-links button{padding:20px 8px;border:1px solid #e6c7e7;background:linear-gradient(130deg,#fff7fb,#f0e5ff);border-radius:18px;color:#79509b;font-weight:750;font-size:14px}.more-links span{display:block;font-size:24px;margin-bottom:6px}.flowerline{text-align:center;color:#d09ac7;letter-spacing:8px;font-size:13px;margin:14px 0}@media(min-width:540px){.hero img{max-height:180px;object-fit:cover}.content{padding:20px 24px}.day{min-height:84px}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header class="hero"><img src="coquette-header.webp" alt="PetalDose floral satin bow and lace header — peptide planner"></header><div class="lace"></div><main id="root" class="content"></main><nav id="nav" class="nav" aria-label="Main navigation"></nav></div><input type="file" id="import" accept="application/json" hidden><script>
'use strict';const KEY='petaldose_lavender_v2';const today=()=>new Date().toLocaleDateString('en-CA');const dateAdd=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=(v,n=2)=>Number.isFinite(+v)?Number(v).toLocaleString(undefined,{maximumFractionDigits:n}):'—';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}};for(const k of ['schedules','logs','vials','stock'])if(!Array.isArray(db[k]))db[k]=[];db.prefs=db.prefs||{};let page='home',picked=today(),month=today().slice(0,7),editing=null,filter='calendar';function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Please export a backup.')}}function scheduleOn(s,d){if(d<s.start||s.end&&d>s.end)return false;if(s.paused&&(!s.resume||d<s.resume))return false;let delta=diff(s.start,d);if(delta<0)return false;if(s.freq==='daily')return true;if(s.freq==='interval')return delta%Math.max(1,+s.interval||1)===0;return (s.days||[]).map(Number).includes(new Date(d+'T12:00:00').getDay())}function planned(d){return db.schedules.filter(s=>scheduleOn(s,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function logOf(id,d){return db.logs.find(l=>l.scheduleId===id&&l.scheduledDate===d)}function doseMg(s){return (+s.dose||0)*(s.unit==='mcg'?0.001:1)}function used(v){return db.logs.filter(l=>l.status==='taken'&&l.vialId===v.id).reduce((n,l)=>n+(+l.doseMg||0),0)}function left(v){return Math.max(0,(+v.mg||0)-used(v))}function activeVials(sid){return db.vials.filter(v=>v.scheduleId===sid&&['Unopened','Reconstituted'].includes(v.status))}function availableMg(sid){return activeVials(sid).reduce((n,v)=>n+left(v),0)}function need(s){let start=today(),end=s.end||dateAdd(start,29);if(end<start)return 0;let n=0;for(let d=start;d<=end;d=dateAdd(d,1)){if(scheduleOn(s,d)&&!logOf(s.id,d))n++;if(n>1000)break}return n}function go(p){page=p;editing=null;render();window.scrollTo(0,0)}function nav(){const a=[['home','⌂','Home'],['doses','▦','Doses'],['vials','⚗','Vials'],['stock','◈','Stock'],['more','♡','More']];document.getElementById('nav').innerHTML=a.map(x=>`<button class="${(page===x[0]||x[0]==='more'&&['more','settings','calc','history'].includes(page))?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}function title(t,s){return `<h1 class="page-title">${t}</h1><p class="subtitle">${s}</p>`}function greeting(){return `<div class="greeting"><h1>Hi, ${esc(db.prefs.nickname||'lovely')}! ♡ <button class="editnick" onclick="editNickname()" title="Edit nickname">✎</button></h1><p>Your little corner for schedules & sweet organization</p></div>`}function editNickname(){const x=prompt('Choose your nickname (up to 40 characters):',db.prefs.nickname||'');if(x===null)return;if(x.length>40)return alert('Please use 40 characters or fewer.');db.prefs.nickname=x.trim();save();render()}function cardDose(s,d){let l=logOf(s.id,d),status=l?.status||'pending';return `<div class="entry"><div class="row between"><strong>${esc(s.name)}</strong><span class="pill ${status==='taken'?'done':status==='skipped'?'skip':''}">${status==='taken'?'✓ Taken':status==='skipped'?'Skipped':'◷ Due'}</span></div><small>${esc(s.time||'Time not set')} · ${esc(s.route||'Route not set')} ${l?.site?'· '+esc(l.site):''}</small><div class="row between"><span>${fmt(s.dose,3)} ${esc(s.unit||'mg')}</span><span class="subtitle" style="margin:0">${s.units?fmt(s.units,2)+' syringe units':''}</span></div><div class="actions"><button class="btn small" onclick="record('${s.id}','${d}','taken')">✓ Taken</button><button class="btn secondary small" onclick="record('${s.id}','${d}','skipped')">Skipped</button>${l?`<button class="btn warn small" onclick="undo('${l.id}')">Undo</button>`:''}</div></div>`}function dayDoses(d){let a=planned(d);return a.length?a.map(s=>cardDose(s,d)).join(''):'<div class="empty">No doses scheduled for this date. ♡</div>'}function home(){let d=today(),a=planned(d);return greeting()+`<div class="stats">${[['♡',a.length,'Today’s doses'],['✓',a.filter(s=>logOf(s.id,d)?.status==='taken').length,'Completed'],['⚗',db.vials.filter(v=>v.status==='Reconstituted').length,'Open vials'],['✿',db.logs.filter(l=>l.status==='taken').length,'Total logged']].map(x=>`<div class="stat"><div class="orn">${x[0]}</div><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div><section class="panel"><div class="panel-head"><h2>Today's schedule</h2><button class="btn secondary small" onclick="go('doses')">Calendar ›</button></div>${dayDoses(d)}</section><section class="panel"><h2>Tomorrow's little plan</h2>${dayDoses(dateAdd(d,1))}</section><div class="flowerline">✿ ♡ ✿</div>`}function calendar(){let start=month+'-01',first=new Date(start+'T12:00:00'),offset=first.getDay(),begin=dateAdd(start,-offset);let out=`<div class="month"><button onclick="changeMonth(-1)">‹</button><strong>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button onclick="changeMonth(1)">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<span class="weekday">${x}</span>`).join('')}`;for(let i=0;i<42;i++){let d=dateAdd(begin,i),a=planned(d),done=a.filter(s=>logOf(s.id,d)?.status==='taken').length;out+=`<button class="day ${d===picked?'selected':''} ${d.slice(0,7)!==month?'other':''}" onclick="picked='${d}';render()"><div class="num">${+d.slice(-2)}${done?' ✓'+done:''}</div>${a.slice(0,4).map(() =>'<span class="dot"></span>').join('')}${a.length>4?`<em>+${a.length-4}</em>`:''}</button>`}return out+'</div>'}function changeMonth(n){let d=new Date(month+'-15T12:00:00');d.setMonth(d.getMonth()+n);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}function doses(){let options=['calendar','upcoming','history'];return title('Dose calendar','Tap any date to see your scheduled entries.')+`<div class="scroll-tabs">${options.map(x=>`<button class="btn small ${filter===x?'':'secondary'}" onclick="filter='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`+(filter==='history'?historyTable():filter==='upcoming'?`<section class="panel">${Array.from({length:7},(_,i)=>{let d=dateAdd(today(),i);return `<h2>${d}</h2>${dayDoses(d)}`}).join('')}</section>`:`<section class="panel">${calendar()}</section><section class="panel"><h2>♡ ${picked}</h2>${dayDoses(picked)}</section>`)}function record(id,d,status){let s=db.schedules.find(x=>x.id===id),old=logOf(id,d);if(!s)return;let actual='',site='',vialId='',amount=0;if(status==='taken'){let now=new Date(),stamp=today()+'T'+now.toTimeString().slice(0,5);actual=prompt('Actual date and time (YYYY-MM-DDTHH:MM)',old?.actual||stamp);if(actual===null)return;if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(actual))return alert('Please use YYYY-MM-DDTHH:MM');site=prompt('Administration site (optional):',old?.site||'');if(site===null)return;let vs=activeVials(id).filter(v=>left(v)>0||v.id===old?.vialId);if(!vs.length)return alert('Please register a vial under Vials first.');let chosen=prompt('Select vial number:\n'+vs.map((v,i)=>`${i+1}. ${v.label||'Vial'} (${fmt(left(v),3)} mg remaining)`).join('\n'),String(Math.max(1,vs.findIndex(v=>v.id===old?.vialId)+1)));if(chosen===null)return;let v=vs[+chosen-1];if(!v)return alert('Invalid vial selection');amount=doseMg(s);if(amount<=0)return alert('Enter the planned dose in Schedules first.');let available=left(v)+(old?.status==='taken'&&old?.vialId===v.id?(+old.doseMg||0):0);if(amount>available+1e-8)return alert('Insufficient recorded content in this vial.');vialId=v.id}let l={id:old?.id||uid(),scheduleId:id,scheduledDate:d,name:s.name,status,actual,site,vialId,doseMg:amount,dose:s.dose,unit:s.unit,units:s.units};db.logs=db.logs.filter(x=>x.id!==old?.id);db.logs.push(l);save();render()}function undo(id){if(!confirm('Undo this record? Inventory deductions will be reversed.'))return;db.logs=db.logs.filter(l=>l.id!==id);save();render()}function opts(selected=''){return db.schedules.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}function vials(){return title('Vial tracker','A little home for every vial and its history.')+`<section class="panel"><h2>Register a vial</h2><form class="fields" onsubmit="addVial(event)"><label class="field full">Peptide<select name="sid" required>${opts()}</select></label><label class="field">Vial label<input name="label" required placeholder="Vial 01"></label><label class="field">Content (mg)<input name="mg" type="number" min="0.00001" step="any" required></label><label class="field">Status<select name="status"><option>Unopened</option><option>Reconstituted</option></select></label><label class="field">Diluent (mL)<input name="ml" type="number" min="0" step="any"></label><label class="field full">Reconstitution date<input name="date" type="date"></label><button class="btn full">♡ Add vial</button></form></section>${db.vials.map(v=>{let s=db.schedules.find(x=>x.id===v.scheduleId),rem=left(v),d=doseMg(s||{});return `<section class="panel"><div class="panel-head"><h2>${esc(s?.name||'Unknown')} · ${esc(v.label||'Vial')}</h2><span class="pill">${esc(v.status)}</span></div><div class="mini-grid"><div><b>${fmt(rem,3)}</b>mg left</div><div><b>${fmt(used(v),3)}</b>mg logged</div><div><b>${d?Math.floor(rem/d):'—'}</b>nominal doses</div></div><div class="progress"><div style="width:${v.mg?Math.min(100,rem/v.mg*100):0}%"></div></div><p class="subtitle">${fmt(v.mg,3)} mg original · ${esc(v.date||'No recon date')}</p><div class="actions"><button class="btn secondary small" onclick="vialStatus('${v.id}')">Update status</button><button class="btn warn small" onclick="deleteVial('${v.id}')">Delete</button></div><details><summary>Vial history</summary>${(v.events||[]).map(e=>`<p class="subtitle">${esc(e.at)} · ${esc(e.action)}</p>`).join('')}${db.logs.filter(l=>l.vialId===v.id&&l.status==='taken').map(l=>`<p class="subtitle">${esc(l.actual||l.scheduledDate)} · ${fmt(l.doseMg,3)} mg logged</p>`).join('')}</details></section>`}).join('')||'<div class="empty">No vials registered yet.</div>'}<div class="note">Content remaining is an arithmetic estimate. It excludes dead space, wastage and product stability.</div>`}function addVial(e){e.preventDefault();let f=new FormData(e.target);if(!f.get('sid'))return alert('Add a schedule first.');db.vials.push({id:uid(),scheduleId:f.get('sid'),label:f.get('label'),mg:+f.get('mg'),ml:+f.get('ml')||0,date:f.get('date'),status:f.get('status'),events:[{at:today(),action:'Registered'}]});save();render()}function vialStatus(id){let v=db.vials.find(x=>x.id===id);if(!v)return;let status=prompt('Enter: Unopened, Reconstituted, Finished, or Discarded',v.status);if(status===null)return;if(!['Unopened','Reconstituted','Finished','Discarded'].includes(status))return alert('Invalid status');if(status==='Reconstituted'&&v.status!=='Reconstituted'){let d=prompt('Reconstitution date YYYY-MM-DD:',today());if(d===null)return;if(!/^\d{4}-\d\d-\d\d$/.test(d))return alert('Invalid date');v.date=d}v.events=v.events||[];v.events.push({at:today(),action:v.status+' → '+status});v.status=status;save();render()}function deleteVial(id){if(!confirm('Delete this vial? Past dose records will remain.'))return;db.vials=db.vials.filter(v=>v.id!==id);save();render()}function stock(){return title('Inventory & stock','See what is left for each planned cycle.')+db.schedules.map(s=>{let mg=availableMg(s.id),d=doseMg(s),avail=d?Math.floor(mg/d):0,n=need(s),short=Math.max(0,n-avail),vs=activeVials(s.id);return `<section class="panel"><div class="panel-head"><h2>${esc(s.name)}</h2><span class="pill ${d&&avail>=n?'done':'skip'}">${d&&avail>=n?'✓ Nominally enough':'Review stock'}</span></div><div class="mini-grid"><div><b>${fmt(mg,3)}</b>mg tracked</div><div><b>${vs.filter(v=>v.status==='Unopened').length}</b>unopened</div><div><b>${vs.filter(v=>v.status==='Reconstituted').length}</b>reconstituted</div><div><b>${avail}</b>doses available</div><div><b>${n}</b>future doses</div><div><b>${short}</b>dose shortfall</div></div><div class="progress"><div style="width:${n?Math.min(100,avail/n*100):100}%"></div></div><p class="subtitle">Forecast to ${esc(s.end||dateAdd(today(),29))}${s.paused?' · paused':''}</p></section>`}).join('')+`<div class="note">Inventory uses individual vial records, not older bulk stock entries. Estimates do not establish product safety or treatment suitability.</div>`}function more(){return title('More little tools','Everything else, tucked away neatly.')+`<div class="more-links"><button onclick="go('settings')"><span>▦</span>Schedules</button><button onclick="go('calc')"><span>♧</span>Calculator</button><button onclick="go('history')"><span>◷</span>History</button><button onclick="go('settings')"><span>⚙</span>Settings</button></div><div class="flowerline">✿ ♡ ✿</div>`}function settings(){let s=db.schedules.find(x=>x.id===editing);return title('Schedules & settings','Make your planner your own.')+`<section class="panel"><h2>♡ Your nickname</h2><form onsubmit="setNick(event)" class="fields"><label class="field full">What should PetalDose call you?<input name="nick" maxlength="40" value="${esc(db.prefs.nickname||'')}" placeholder="lovely"></label><button class="btn">Save nickname</button></form></section><section class="panel"><h2>Scheduled peptides</h2>${db.schedules.map(x=>`<div class="stock-line"><div><strong>${esc(x.name)}</strong><div class="subtitle">${esc(x.time)} · ${esc(x.freq)} ${x.paused?'· Paused':''}</div></div><div class="toolbar"><button class="btn secondary small" onclick="editing='${x.id}';render()">Edit</button><button class="btn secondary small" onclick="togglePause('${x.id}')">${x.paused?'Resume':'Pause'}</button><button class="btn warn small" onclick="deleteSchedule('${x.id}')">×</button></div></div>`).join('')||'<div class="empty">Add your first schedule below.</div>'}</section><section class="panel"><h2>${s?'Edit':'Add'} schedule</h2><form class="fields" onsubmit="submitSchedule(event)"><label class="field full">Name<input name="name" value="${esc(s?.name||'')}" required></label><label class="field">Time<input type="time" name="time" value="${esc(s?.time||'18:00')}" required></label><label class="field">Route<input name="route" value="${esc(s?.route||'')}"></label><label class="field">Dose amount<input type="number" min="0" step="any" name="dose" value="${esc(s?.dose||'')}"></label><label class="field">Unit<select name="unit"><option ${s?.unit==='mg'?'selected':''}>mg</option><option ${s?.unit==='mcg'?'selected':''}>mcg</option></select></label><label class="field">Syringe units<input type="number" min="0" step="any" name="units" value="${esc(s?.units||'')}"></label><label class="field">Frequency<select name="freq" id="freq" onchange="freqFields()"><option value="daily" ${s?.freq==='daily'?'selected':''}>Daily</option><option value="interval" ${s?.freq==='interval'?'selected':''}>Every N days</option><option value="weekdays" ${s?.freq==='weekdays'?'selected':''}>Selected weekdays</option></select></label><label class="field" id="intervalField">Every N days<input type="number" name="interval" min="1" step="1" value="${esc(s?.interval||5)}"></label><label class="field full" id="weekField">Weekdays (Sun=0, Mon=1, … Sat=6)<input name="days" value="${esc((s?.days||[1,4]).join(','))}" placeholder="1,4"></label><label class="field">Start date<input type="date" name="start" value="${esc(s?.start||today())}" required></label><label class="field">End date<input type="date" name="end" value="${esc(s?.end||'')}"></label><button class="btn full">${s?'Save changes':'♡ Add schedule'}</button>${s?'<button class="btn secondary full" type="button" onclick="editing=null;render()">Cancel</button>':''}</form></section><section class="panel"><h2>Backups</h2><div class="toolbar"><button class="btn" onclick="exportData()">↓ Export JSON</button><button class="btn secondary" onclick="document.getElementById('import').click()">↑ Restore JSON</button></div><div class="note">Data is stored in this browser, not automatically synced. Export backups regularly, especially before updates.</div></section>`}function freqFields(){let f=document.getElementById('freq')?.value;if(document.getElementById('intervalField'))document.getElementById('intervalField').style.display=f==='interval'?'':'none';if(document.getElementById('weekField'))document.getElementById('weekField').style.display=f==='weekdays'?'':'none'}function setNick(e){e.preventDefault();db.prefs.nickname=String(new FormData(e.target).get('nick')||'').trim();save();render()}function submitSchedule(e){e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end&&end<start)return alert('End date must be after start date');let days=String(f.get('days')||'').split(',').map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(f.get('freq')==='weekdays'&&!days.length)return alert('Select valid weekdays');let old=db.schedules.find(x=>x.id===editing)||{};let obj={...old,id:editing||uid(),name:String(f.get('name')).trim(),time:f.get('time'),route:f.get('route'),dose:+f.get('dose')||0,unit:f.get('unit'),units:+f.get('units')||0,freq:f.get('freq'),interval:Math.max(1,+f.get('interval')||1),days,start,end};if(editing)db.schedules=db.schedules.map(x=>x.id===editing?obj:x);else db.schedules.push(obj);editing=null;save();render()}function togglePause(id){let s=db.schedules.find(x=>x.id===id);if(!s)return;if(s.paused){s.paused=false;s.resume=''}else{let d=prompt('Optional planned resume date YYYY-MM-DD (blank = indefinite pause):','');if(d===null)return;if(d&&!/^\d{4}-\d\d-\d\d$/.test(d))return alert('Invalid date');s.paused=true;s.resume=d}save();render()}function deleteSchedule(id){if(!confirm('Delete schedule? Historical records are kept.'))return;db.schedules=db.schedules.filter(s=>s.id!==id);save();render()}function calc(){return title('Peptide calculator','Arithmetic based only on your entered values.')+`<section class="panel"><div class="fields"><label class="field">Vial content (mg)<input id="cmg" type="number" min="0" step="any" value="10" oninput="updateCalc()"></label><label class="field">Diluent (mL)<input id="cml" type="number" min="0" step="any" value="2" oninput="updateCalc()"></label><label class="field">Entered dose (mg)<input id="cd" type="number" min="0" step="any" value="1" oninput="updateCalc()"></label><label class="field">Syringe units per mL<input id="cu" type="number" min="0" step="any" value="100" oninput="updateCalc()"></label></div><div id="calcResult"></div><div class="note">This does not recommend a dose, injection route, or medication regimen. Verify product concentration and syringe calibration independently.</div></section>`}function updateCalc(){let mg=+document.getElementById('cmg').value,ml=+document.getElementById('cml').value,d=+document.getElementById('cd').value,u=+document.getElementById('cu').value;document.getElementById('calcResult').innerHTML=mg>0&&ml>0&&d>0&&u>0?`<div class="mini-grid" style="margin-top:14px"><div><b>${fmt(mg/ml,4)}</b>mg/mL</div><div><b>${fmt(d*ml/mg,4)}</b>mL</div><div><b>${fmt(d*ml/mg*u,2)}</b>syringe units</div></div>`:'<div class="note">Enter positive numbers in every field.</div>'}function historyTable(){let logs=[...db.logs].sort((a,b)=>(b.actual||b.scheduledDate).localeCompare(a.actual||a.scheduledDate));return `<section class="panel"><h2>Recorded history</h2>${logs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Scheduled</th><th>Name</th><th>Status</th><th>Actual</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(l.scheduledDate)}</td><td>${esc(l.name)}</td><td>${esc(l.status)}</td><td>${esc(l.actual||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No entries logged yet.</div>'}</section>`}function history(){return title('Dose history','Your administration log over time.')+historyTable()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='petaldose-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.schedules)||!Array.isArray(d.logs)||!Array.isArray(d.vials))throw Error('Invalid backup');if(confirm('Replace all local records with this backup?')){db=d;db.prefs=db.prefs||{};save();render()}}catch(err){alert(err.message)}e.target.value='' });function render(){nav();document.getElementById('root').innerHTML=({home,doses,vials,stock,more,settings,calc,history}[page])();if(page==='settings')freqFields();if(page==='calc')updateCalc()}render();
</script></body></html>
