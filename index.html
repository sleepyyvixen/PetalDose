<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6dbe9"><title>petaldose</title><style>

x;padding:4px 10px;background:#f3e7fb;color:#7856b2;font-size:11px;font-weight:700}.chip.good{background:#e5f6ef;color:#277c60}.chip.warn{background:#fff0dd;color:#99621e}.chip.bad{background:#ffebef;color:#b94562}.btn{border:1px solid #e6b8d5;background:#fff;color:#a44884;border-radius:11px;padding:10px 14px;font-weight:650}.btn.primary{background:#d875ad;color:white;border-color:#d875ad}.btn.lav{background:#a38ce5;color:white;border-color:#a38ce5}.btn.tiny{padding:6px 9px;font-size:12px}.btn.danger{color:#b74460;border-color:#f3ccd6}.btns{display:flex;gap:8px;flex-wrap:wrap}.dose{border:1px solid #efd6e7;border-radius:15px;padding:14px;margin:10px 0;background:#fff}.dose strong{font-size:16px}.dose .right{text-align:right;margin-left:auto}.dose .meta{color:var(--muted);margin-top:5px;font-size:12px}.dose .actions{margin-top:12px;display:flex;gap:8px}.dose .actions button{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:6px}.day{min-height:93px;border:1px solid #f0d6e6;background:white;border-radius:11px;padding:7px;min-width:0;text-align:left;color:var(--ink)}.day.selected{outline:2px solid #b78fea;background:#f8efff}.day.out{opacity:.36}.day .num{font-weight:750;margin-bottom:6px}.event{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:white;border-radius:5px;padding:3px 4px;font-size:10px;margin:3px 0}.more{font-size:10px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;color:#5c526c;font-size:12px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #e7cfe1;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:70px}.full{grid-column:1/-1}.listrow{padding:13px 0;border-bottom:1px solid #f0e3ed}.listrow:last-child{border-bottom:0}.progress{height:9px;background:#f1e5f0;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#e48bb4,#aa93e6)}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid #f1e5ef;white-space:nowrap}th{color:var(--muted)}.notice{background:#f8eafa;border:1px solid #ead2ef;padding:12px;border-radius:12px;color:#625371;font-size:12px;margin:12px 0}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #e6cfe0;border-radius:14px}.bars{display:flex;align-items:end;gap:5px;height:175px;border-bottom:1px solid #ddd0e5;padding:10px 0}.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;min-width:0}.bar{width:65%;max-width:28px;background:linear-gradient(#a58be5,#e5a0c7);border-radius:6px 6px 0 0;min-height:2px}.barlabel{font-size:10px;color:var(--muted);margin-top:5px}.hidden{display:none!important}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}main{padding:16px}.top{padding:12px 14px 0}.day{min-height:72px;padding:4px}.event{font-size:9px}nav button{min-width:75px;padding:10px}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.stats{gap:9px}.card{padding:13px;border-radius:15px}.title{font-size:24px}.day{min-height:62px}.day .num{font-size:11px}.event{font-size:8px}.dose .actions{flex-wrap:wrap}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="brandflower">✿</span> petaldose <span class="brandhearts">♡ ✧</span></div><div class="sub">peptide planner <span class="subflower">✿</span></div><nav id="nav"></nav></header><main id="app"></main></div><input type="file" id="importFile" accept="application/json" hidden><script>
'use strict';const KEY='petaldose_lavender_v1';const tabs=[['home','⌂','Home'],['calc','▦','Calc'],['vials','⚗','Vials'],['doses','▦','Doses'],['levels','〽','Levels'],['stock','▧','Stock'],['settings','⚙','Settings']];let tab='home',selected=iso(new Date()),month=iso(new Date()).slice(0,7),doseFilter='calendar',editId=null;const colors=['#ad8bef','#e78ab6','#8dbfae','#f1ae80','#a8a0dc','#dd8bb7'];function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function nowLocal(){let d=new Date();return iso(d)+'T'+d.toTimeString().slice(0,5)}function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}function empty(){return {schedules:[],vials:[],logs:[],stock:[],prefs:{}}}let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch(e){db=empty()}for(let k of ['schedules','vials','logs','stock'])if(!Array.isArray(db[k]))db[k]=[];function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage is unavailable. Export a backup and use HTTPS hosting.')}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n,d=1){return Number.isFinite(n)?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—'}function dateAdd(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}function schedOn(s,date){if(date<s.start||s.end&&date>s.end)return false;let diff=daysBetween(s.start,date);if(diff<0)return false;if(s.freq==='daily')return true;if(s.freq==='interval')return diff%Math.max(1,+s.interval||1)===0;let days=Array.isArray(s.days)?s.days.map(Number):[];return days.includes(new Date(date+'T12:00:00').getDay())}function scheduled(date){return db.schedules.filter(s=>schedOn(s,date)).sort((a,b)=>a.time.localeCompare(b.time))}function logFor(id,date){return db.logs.find(l=>l.scheduleId===id&&l.scheduledDate===date)}function color(s){return colors[db.schedules.findIndex(x=>x.id===s.id)%colors.length]||colors[0]}function sumStock(s){return db.stock.filter(x=>x.scheduleId===s.id).reduce((a,x)=>a+(+x.count||0)*(+x.mg||0),0)}function remainingNeed(s){let end=s.end||dateAdd(iso(new Date()),29),start=iso(new Date());if(end<start)return 0;let n=0;for(let d=start;d<=end;d=dateAdd(d,1)){if(schedOn(s,d)&&!logFor(s.id,d))n++;if(n>5000)break}return n}function navRender(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="go('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}</button>`).join('')}function go(t){tab=t;editId=null;render()}function render(){navRender();document.getElementById('app').innerHTML=({home:home,calc:calc,vials:vials,doses:doses,levels:levels,stock:stock,settings:settings}[tab])()}function heading(t,sub){return `<h1 class="title">${t}</h1><p class="lead">${sub}</p>`}function stats(){let today=iso(new Date()),todayS=scheduled(today),done=todayS.filter(s=>logFor(s.id,today)?.status==='taken').length;return `<div class="grid stats">${[['⚗',db.vials.length,'Tracked vials'],['♡',todayS.length,"Today's doses"],['▦',db.logs.filter(x=>x.status==='taken'&&daysBetween(x.scheduledDate,today)>=0&&daysBetween(x.scheduledDate,today)<7).length,'Taken this week'],['✓',db.logs.filter(x=>x.status==='taken').length,'Total logged']].map(x=>`<div class="card stat"><span class="emoji">${x[0]}</span><div class="n">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div>`}function doseCards(date){let a=scheduled(date);return a.length?a.map(s=>{let l=logFor(s.id,date),status=l?.status||'pending';return `<div class="dose"><div class="row"><span style="width:9px;height:35px;border-radius:8px;background:${color(s)}"></span><div style="min-width:0"><strong>${esc(s.name)}</strong> <span class="chip ${status==='taken'?'good':status==='skipped'?'warn':''}">${status==='taken'?'✓ Taken':status==='skipped'?'Skipped':'◷ Pending'}</span><div class="meta">${esc(s.time)} · ${esc(s.route||'Route not set')}${l?.site?' · '+esc(l.site):''}</div></div><div class="right"><strong>${esc(s.dose||'—')} ${esc(s.unit||'')}</strong><div class="meta">${esc(s.units||'—')} syringe units</div></div></div><div class="actions"><button class="btn tiny" onclick="record('${s.id}','${date}','taken')">✓ Record taken</button><button class="btn tiny" onclick="record('${s.id}','${date}','skipped')">× Skipped</button>${l?`<button class="btn tiny danger" onclick="clearLog('${l.id}')">Undo</button>`:''}</div></div>`}).join(''):`<div class="empty">No doses scheduled for this date. Add schedules in Settings.</div>`}function home(){let today=iso(new Date()),tom=dateAdd(today,1);return heading('Hello, lovely! ♡','Your soft little space for schedules, stock and tracking.')+stats()+`<div class="grid two" style="margin-top:16px"><section class="card"><div class="row between"><h2>Today · ${today}</h2><button class="btn tiny" onclick="go('doses')">Calendar →</button></div>${doseCards(today)}</section><section class="card"><h2>Tomorrow · ${tom}</h2>${doseCards(tom)}</section></div>`}function monthChange(n){let d=new Date(month+'-15T12:00:00');d.setMonth(d.getMonth()+n);month=iso(d).slice(0,7);render()}function chooseDay(d){selected=d;render()}function calendar(){let first=new Date(month+'-01T12:00:00'),offset=first.getDay(),start=dateAdd(month+'-01',-offset),days=42;let out=`<div class="row between" style="margin-bottom:14px"><button class="btn tiny" onclick="monthChange(-1)">‹</button><strong>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</strong><button class="btn tiny" onclick="monthChange(1)">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(d=>`<div class="weekday">${d}</div>`).join('')}`;for(let i=0;i<days;i++){let d=dateAdd(start,i),items=scheduled(d),done=items.filter(s=>logFor(s.id,d)?.status==='taken').length;out+=`<button class="day ${d===selected?'selected':''} ${d.slice(0,7)!==month?'out':''}" onclick="chooseDay('${d}')"><div class="num">${Number(d.slice(-2))} ${done?'<span style="float:right;font-size:10px;color:#8e6db6">✓'+done+'</span>':''}</div>${items.slice(0,3).map(s=>`<span class="event" style="background:${color(s)}">${esc(s.name)}</span>`).join('')}${items.length>3?`<span class="more">+${items.length-3} more</span>`:''}</button>`}return out+'</div>'}function doses(){let today=iso(new Date());let filters=['calendar','upcoming','today','week','all'];let head=heading('Dose Log','Calendar, upcoming schedule and recorded history.')+`<div class="btns" style="margin-bottom:16px">${filters.map(x=>`<button class="btn tiny ${doseFilter===x?'primary':''}" onclick="doseFilter='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`;if(doseFilter==='calendar')return head+`<div class="grid two"><div class="card">${calendar()}</div><div class="card"><h2>♡ ${selected}</h2><p class="muted small">Tap a day to view and record each scheduled dose.</p>${doseCards(selected)}</div></div>`;if(doseFilter==='all')return head+`<div class="card"><h2>Administration history</h2>${history()}</div>`;let dates=doseFilter==='today'?[today]:doseFilter==='week'?Array.from({length:7},(_,i)=>dateAdd(today,i)):Array.from({length:14},(_,i)=>dateAdd(today,i));return head+`<div class="grid two"><div class="card">${dates.map(d=>`<h3>${d}</h3>${doseCards(d)}`).join('')}</div><div class="card"><h2>Recent history</h2>${history(8)}</div></div>`}function history(limit){let arr=[...db.logs].sort((a,b)=>(b.actual||b.scheduledDate).localeCompare(a.actual||a.scheduledDate));if(limit)arr=arr.slice(0,limit);return arr.length?`<div class="tablewrap"><table><thead><tr><th>Scheduled</th><th>Peptide</th><th>Status</th><th>Actual</th><th>Site</th></tr></thead><tbody>${arr.map(l=>`<tr><td>${esc(l.scheduledDate)}</td><td>${esc(l.name)}</td><td>${esc(l.status)}</td><td>${esc(l.actual||'—')}</td><td>${esc(l.site||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No doses recorded yet.</div>'}function record(id,date,status){let s=db.schedules.find(x=>x.id===id);if(!s)return;let old=logFor(id,date),actual=status==='taken'?prompt('Actual date and time (YYYY-MM-DDTHH:MM). Edit if needed:',old?.actual||nowLocal()):'';if(status==='taken'&&actual===null)return;if(actual&&!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(actual)){alert('Please enter a date and time in YYYY-MM-DDTHH:MM format.');return}let site=status==='taken'?prompt('Injection site (optional; leave blank if not applicable):',old?.site||''):'';if(status==='taken'&&site===null)return;let l={id:old?.id||uid(),scheduleId:id,scheduledDate:date,name:s.name,status,actual:actual||'',site:site||'',dose:s.dose,unit:s.unit,units:s.units};db.logs=db.logs.filter(x=>x.id!==old?.id);db.logs.push(l);save();render()}function clearLog(id){if(confirm('Remove this recorded status?')){db.logs=db.logs.filter(x=>x.id!==id);save();render()}}function calc(){return heading('Peptide Calculator','Arithmetic only — enter values from your own product and prescribed plan.')+`<div class="grid two"><div class="card"><div class="formgrid"><label class="field">Vial content (mg)<input type="number" min="0" step="any" id="cMg" value="10" oninput="calcUpdate()"></label><label class="field">Diluent volume (mL)<input type="number" min="0" step="any" id="cMl" value="2" oninput="calcUpdate()"></label><label class="field">Entered dose (mg)<input type="number" min="0" step="any" id="cDose" value="1" oninput="calcUpdate()"></label><label class="field">Syringe units per mL<input type="number" min="0" step="any" id="cUnits" value="100" oninput="calcUpdate()"></label></div><div class="notice">Use only the actual syringe calibration and verified vial concentration. The calculator does not determine an appropriate dose, route, sterility, or product safety.</div></div><div class="card"><h2>Calculated values</h2><div id="calcResults"></div></div></div>`}function calcUpdate(){let mg=+document.getElementById('cMg').value,ml=+document.getElementById('cMl').value,d=+document.getElementById('cDose').value,u=+document.getElementById('cUnits').value;let good=mg>0&&ml>0&&d>0&&u>0;document.getElementById('calcResults').innerHTML=good?`<div class="stat"><div class="hint">Concentration</div><div class="n">${fmt(mg/ml,4)} mg/mL</div><div class="hint">Calculated volume</div><div class="n">${fmt(d/(mg/ml),4)} mL</div><div class="hint">Syringe markings (based on entered calibration)</div><div class="n">${fmt(d/(mg/ml)*u,2)} units</div><div class="hint">Nominal full doses per vial</div><div class="n">${fmt(Math.floor(mg/d),0)}</div></div>`:'<div class="empty">Enter positive values in all fields.</div>'}function vialForm(){return `<div class="card"><h2>Add a vial record</h2><form onsubmit="addVial(event)" class="formgrid"><label class="field">Peptide<select name="sid" required>${opts()}</select></label><label class="field">Vial identifier<input name="label" placeholder="e.g. Vial A"></label><label class="field">Content (mg)<input name="mg" type="number" min="0.0001" step="any" required></label><label class="field">Diluent added (mL)<input name="ml" type="number" min="0" step="any" placeholder="Optional"></label><label class="field">Reconstitution date<input name="date" type="date"></label><label class="field">Status<select name="status"><option>Unopened</option><option>Reconstituted</option><option>Finished</option><option>Discarded</option></select></label><button class="btn primary full">Add vial</button></form></div>`}function opts(selectedId=''){return db.schedules.length?db.schedules.map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${esc(s.name)}</option>`).join(''):'<option value="">Add a schedule first</option>'}function addVial(e){e.preventDefault();let f=new FormData(e.target);if(!f.get('sid'))return alert('Add a schedule first.');db.vials.push({id:uid(),scheduleId:f.get('sid'),label:f.get('label'),mg:+f.get('mg'),ml:+f.get('ml'),date:f.get('date'),status:f.get('status')});save();render()}function vials(){return heading('Vial Tracker','Keep a record of your individual vials and cycle dates.')+`<div class="grid two"><div>${db.vials.map(v=>{let s=db.schedules.find(x=>x.id===v.scheduleId);return `<div class="card" style="margin-bottom:12px"><div class="row between"><h2>${esc(s?.name||'Unknown')} · ${esc(v.label||'Vial')}</h2><span class="chip">${esc(v.status)}</span></div><p class="muted">${fmt(v.mg,3)} mg ${v.ml?'· '+fmt(v.ml,2)+' mL':''} · ${esc(v.date||'Date not entered')}</p><div class="btns"><button class="btn tiny" onclick="setVialStatus('${v.id}')">Change status</button><button class="btn tiny danger" onclick="delVial('${v.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">No vial records yet.</div>'}</div>${vialForm()}</div>`}function setVialStatus(id){let v=db.vials.find(x=>x.id===id);let a=prompt('Enter status: Unopened, Reconstituted, Finished, or Discarded',v.status);if(a&&['Unopened','Reconstituted','Finished','Discarded'].includes(a)){v.status=a;save();render()}}function delVial(id){if(confirm('Delete vial record?')){db.vials=db.vials.filter(x=>x.id!==id);save();render()}}function levels(){let today=iso(new Date()),dates=Array.from({length:14},(_,i)=>dateAdd(today,i-13)),values=dates.map(d=>db.logs.filter(l=>l.actual?.slice(0,10)===d&&l.status==='taken').length),max=Math.max(1,...values);return heading('Recorded Levels','Visualize administration counts and logged dose amounts — not estimated blood concentrations.')+`<div class="grid two"><div class="card"><h2>Administrations · last 14 days</h2><div class="bars">${dates.map((d,i)=>`<div class="barwrap"><div class="bar" title="${values[i]} on ${d}" style="height:${Math.max(2,values[i]/max*135)}px"></div><span class="barlabel">${d.slice(-2)}</span></div>`).join('')}</div><p class="muted small">Chart shows recorded doses by actual administration date.</p></div><div class="card"><h2>By peptide</h2>${db.schedules.map(s=>`<div class="listrow row between"><span>${esc(s.name)}</span><strong>${db.logs.filter(l=>l.scheduleId===s.id&&l.status==='taken').length} taken</strong></div>`).join('')||'<div class="empty">No schedules yet.</div>'}<div class="notice">Pharmacokinetic or blood-level predictions require validated drug-specific models and are not provided here.</div></div></div>`}function addStock(e){e.preventDefault();let f=new FormData(e.target);if(!f.get('sid'))return alert('Add a schedule first.');db.stock.push({id:uid(),scheduleId:f.get('sid'),mg:+f.get('mg'),count:+f.get('count'),label:f.get('label')});save();render()}function stock(){return heading('Stock & Cycle Forecast','Automatic inventory estimates based on your entered schedules and stock.')+`<div class="grid two"><div><div class="grid">${db.schedules.map(s=>{let stockMg=sumStock(s),dose=(+s.dose||0)*(s.unit==='mcg'?0.001:1),need=remainingNeed(s),available=dose>0?Math.floor(stockMg/dose):0,short=Math.max(0,need-available),ratio=need?Math.min(100,available/need*100):100;return `<div class="card"><div class="row between"><h2 style="margin:0">${esc(s.name)}</h2><span class="chip ${!dose?'warn':available>=need?'good':'bad'}">${!dose?'Enter dose':available>=need?'✓ Sufficient nominal stock':'Shortfall'}</span></div><p class="muted">${fmt(stockMg,3)} mg in inventory · ${fmt(+s.dose||0,3)} ${esc(s.unit||'mg')} per scheduled dose</p><div class="grid three" style="gap:10px"><div><strong>${available}</strong><div class="muted small">Nominal doses available</div></div><div><strong>${need}</strong><div class="muted small">Scheduled doses left</div></div><div><strong>${short}</strong><div class="muted small">Estimated dose shortfall</div></div></div><div class="progress" style="margin-top:12px"><div style="width:${ratio}%"></div></div><p class="small muted">${s.end?'Through '+esc(s.end):'Forecast assumes the next 30 days if no cycle end date is set.'} Does not account for vial dead space, spoilage, or missed doses.</p></div>`}).join('')||'<div class="empty">Add schedules in Settings to forecast stock.</div>'}</div><div class="card" style="margin-top:16px"><h2>Stock entries</h2>${db.stock.map(x=>{let s=db.schedules.find(y=>y.id===x.scheduleId);return `<div class="listrow row between"><span>${esc(s?.name||'Unknown')} · ${esc(x.label||'Stock')}<br><span class="small muted">${x.count} vial(s) × ${x.mg} mg</span></span><button class="btn tiny danger" onclick="delStock('${x.id}')">Remove</button></div>`}).join('')||'<div class="empty">No stock added.</div>'}</div></div><div class="card"><h2>Add stock</h2><form class="formgrid" onsubmit="addStock(event)"><label class="field full">Peptide<select name="sid" required>${opts()}</select></label><label class="field full">Label<input name="label" placeholder="e.g. Sealed box"></label><label class="field">Vials in stock<input name="count" type="number" min="1" step="1" required></label><label class="field">Content per vial (mg)<input name="mg" type="number" min="0.0001" step="any" required></label><button class="btn primary full">+ Add stock</button></form><div class="notice">Inventory is entered separately from individual vial records to prevent accidental double counting. Record each physical vial in only one inventory entry. This is a planning estimate, not a recommendation to purchase, use, or continue a peptide.</div></div></div>`}function delStock(id){if(confirm('Remove this stock entry?')){db.stock=db.stock.filter(x=>x.id!==id);save();render()}}function settings(){let s=db.schedules.find(x=>x.id===editId);return heading('Schedules & Settings','Manage 2–4 peptides or more, and keep a portable backup.')+`<div class="grid two"><div><div class="card"><h2>Active schedules</h2>${db.schedules.map(x=>`<div class="listrow row between"><div><strong>${esc(x.name)}</strong><div class="small muted">${esc(x.time)} · ${esc(x.freq==='interval'?'Every '+x.interval+' days':x.freq==='weekdays'?'Selected weekdays':x.freq)} · ${esc(x.start)} ${x.end?'to '+esc(x.end):''}</div></div><div class="btns"><button class="btn tiny" onclick="editId='${x.id}';render()">Edit</button><button class="btn tiny danger" onclick="delSchedule('${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No schedules yet.</div>'}</div><div class="card" style="margin-top:16px"><h2>Backup & Restore</h2><p class="muted small">Records are saved in this browser on this device. Export before clearing browser data or switching devices.</p><div class="btns"><button class="btn lav" onclick="exportData()">↓ Export JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ Import JSON</button></div><div class="notice">Hosting the app does not make records private across devices or automatically sync them. Anyone with your unlocked browser profile may access local records.</div></div></div><div class="card"><h2>${s?'Edit':'Add'} peptide schedule</h2><form class="formgrid" onsubmit="submitSchedule(event)"><label class="field full">Peptide name<input name="name" value="${esc(s?.name||'')}" required placeholder="Enter name"></label><label class="field">Scheduled time<input name="time" type="time" value="${esc(s?.time||'18:00')}" required></label><label class="field">Route (optional)<input name="route" value="${esc(s?.route||'')}" placeholder="e.g. SubQ"></label><label class="field">Dose amount (optional)<input name="dose" type="number" min="0" step="any" value="${esc(s?.dose||'')}"></label><label class="field">Dose unit<select name="unit"><option ${s?.unit==='mg'?'selected':''}>mg</option><option ${s?.unit==='mcg'?'selected':''}>mcg</option></select></label><label class="field">Syringe units (optional)<input name="units" type="number" min="0" step="any" value="${esc(s?.units||'')}"></label><label class="field">Frequency<select name="freq" id="freq" onchange="freqToggle()"><option value="daily" ${s?.freq==='daily'?'selected':''}>Daily</option><option value="interval" ${s?.freq==='interval'?'selected':''}>Every N days</option><option value="weekdays" ${s?.freq==='weekdays'?'selected':''}>Selected weekdays</option></select></label><label class="field" id="intervalField">Interval (days)<input name="interval" type="number" min="1" step="1" value="${esc(s?.interval||5)}"></label><label class="field full" id="weekField">Weekdays (Sun=0, Mon=1 … Sat=6)<input name="days" placeholder="e.g. 1,4 for Monday and Thursday" value="${esc((s?.days||[1,4]).join(','))}"></label><label class="field">Cycle start<input name="start" type="date" required value="${esc(s?.start||iso(new Date()))}"></label><label class="field">Cycle end (optional)<input name="end" type="date" value="${esc(s?.end||'')}"></label><div class="btns full"><button class="btn primary">${s?'Save changes':'Add schedule'}</button>${s?'<button class="btn" type="button" onclick="editId=null;render()">Cancel</button>':''}</div></form><div class="notice">Only enter a schedule prescribed or otherwise verified by a qualified clinician. Changing a schedule does not automatically rewrite historical administration records.</div></div></div>`}function freqToggle(){let f=document.getElementById('freq').value;document.getElementById('intervalField').classList.toggle('hidden',f!=='interval');document.getElementById('weekField').classList.toggle('hidden',f!=='weekdays')}function submitSchedule(e){e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end'),freq=f.get('freq');if(end&&end<start)return alert('Cycle end cannot precede start.');let days=String(f.get('days')||'').split(',').map(x=>+x.trim()).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(freq==='weekdays'&&!days.length)return alert('Enter weekdays as numbers from 0 to 6.');let obj={id:editId||uid(),name:String(f.get('name')).trim(),time:f.get('time'),route:f.get('route'),dose:+f.get('dose')||0,unit:f.get('unit'),units:+f.get('units')||0,freq,interval:Math.max(1,+f.get('interval')||1),days,start,end};if(!obj.name)return;if(editId)db.schedules=db.schedules.map(x=>x.id===editId?obj:x);else db.schedules.push(obj);editId=null;save();render()}function delSchedule(id){if(!confirm('Delete this schedule? Its historical logs and stock records will remain but may be orphaned.'))return;db.schedules=db.schedules.filter(x=>x.id!==id);save();render()}function exportData(){let b=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='petaldose-lavender-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.getElementById('importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.schedules)||!Array.isArray(d.logs)||!Array.isArray(d.stock)||!Array.isArray(d.vials))throw Error('Not a valid PetalDose backup');if(confirm('Replace ALL current dashboard records with this backup?')){db=d;save();render()}}catch(err){alert('Import failed: '+err.message)}e.target.value='' });render();const oldGo=go;go=function(t){oldGo(t);if(t==='calc')calcUpdate();if(t==='settings')freqToggle()};
</script><style>
.v2note{background:#f1e9ff;border:1px solid #dac7f7;border-radius:14px;padding:12px;margin:12px 0;color:#66517f}.v2pill{display:inline-block;border-radius:20px;background:#f4e7ff;padding:4px 10px;color:#73519e;font-size:12px}.v2grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.v2grid>div{background:#faf2ff;border-radius:14px;padding:12px}.v2grid strong{font-size:20px;display:block}

<script>
// V2: separate browser data namespace; preserve V1 and original dashboard.
const V2KEY='petaldose_lavender_v2';
try{const prior=localStorage.getItem(V2KEY);if(prior){const d=JSON.parse(prior);if(d&&Array.isArray(d.schedules)&&Array.isArray(d.vials)&&Array.isArray(d.logs)){db=d}}else{db=JSON.parse(JSON.stringify(db));localStorage.setItem(V2KEY,JSON.stringify(db))}}catch(e){console.warn('V2 migration unavailable',e)}
save=function(){try{localStorage.setItem(V2KEY,JSON.stringify(db))}catch(e){alert('Could not save. Export your records before leaving.')}};
function doseMg(s){return (+s.dose||0)*(s.unit==='mcg'?0.001:1)}
function spent(v){return db.logs.filter(l=>l.status==='taken'&&l.vialId===v.id).reduce((n,l)=>n+(+l.doseMg||0),0)}
function vialLeft(v){return Math.max(0,(+v.mg||0)-spent(v))}
function liveVials(sid){return db.vials.filter(v=>v.scheduleId===sid&&['Unopened','Reconstituted'].includes(v.status))}
function totalLeft(sid){return liveVials(sid).reduce((n,v)=>n+vialLeft(v),0)}
function futureNeed(s){const today=iso(new Date()),end=s.end||dateAdd(today,29);if(end<today)return 0;let n=0;for(let d=today;d<=end;d=dateAdd(d,1)){if(schedOn(s,d)&&!logFor(s.id,d)&&!(s.paused&&(!s.resume||d<s.resume)))n++;if(n>2000)break}return n}
function changePause(id){let s=db.schedules.find(x=>x.id===id);if(!s)return;if(s.paused){s.paused=false;s.resume='';}else{const resume=prompt('Pause schedule. Optional planned resume date (YYYY-MM-DD), or leave blank for indefinite pause:','');if(resume===null)return;if(resume&&!/^\d{4}-\d{2}-\d{2}$/.test(resume))return alert('Enter YYYY-MM-DD');s.paused=true;s.resume=resume;}save();render()}
const v1Settings=settings;
settings=function(){let html=v1Settings();const extra=`<div class="card" style="margin-top:16px"><h2>♡ Cycle pause / resume</h2>${db.schedules.map(s=>`<div class="listrow row between"><div><strong>${esc(s.name)}</strong><div class="small muted">${s.paused?'Paused'+(s.resume?' · resumes '+esc(s.resume):' indefinitely'):'Active'} · ${esc(s.start)} → ${esc(s.end||'No end entered')}</div></div><button class="btn tiny" onclick="changePause('${s.id}')">${s.paused?'Resume now':'Pause'}</button></div>`).join('')||'<p>Add a schedule first.</p>'}<div class="v2note">Pausing affects forecasts and future schedule display; it does not erase past records or automatically extend your cycle. Review dates when resuming.</div></div>`;return html+extra};
const baseSchedOn=schedOn;
schedOn=function(s,d){return baseSchedOn(s,d)&&!(s.paused&&(!s.resume||d<s.resume))};
function v2VialForm(){return `<div class="card"><h2>+ Register a physical vial</h2><form class="formgrid" onsubmit="v2AddVial(event)"><label class="field full">Peptide<select name="sid" required>${opts()}</select></label><label class="field">Vial label<input name="label" placeholder="e.g. Vial 01" required></label><label class="field">Content (mg)<input name="mg" type="number" min="0.0001" step="any" required></label><label class="field">Status<select name="status"><option>Unopened</option><option>Reconstituted</option></select></label><label class="field">Diluent (mL, optional)<input name="ml" type="number" min="0" step="any"></label><label class="field">Reconstitution date<input name="date" type="date"></label><label class="field full">Notes / batch<input name="notes"></label><button class="btn primary full">Add vial</button></form><div class="v2note">Each physical vial is entered once. Inventory is deducted from the selected vial when a dose is recorded as taken. No dose is deducted for skipped entries.</div></div>`}
function v2AddVial(e){e.preventDefault();const f=new FormData(e.target);db.vials.push({id:uid(),scheduleId:f.get('sid'),label:String(f.get('label')),mg:+f.get('mg'),ml:+f.get('ml')||0,date:f.get('date'),status:f.get('status'),notes:f.get('notes'),events:[{at:nowLocal(),action:'Registered '+f.get('status')}]});save();render()}
function v2Status(id){let v=db.vials.find(x=>x.id===id);if(!v)return;const x=prompt('New status: Unopened, Reconstituted, Finished, Discarded',v.status);if(!x)return;if(!['Unopened','Reconstituted','Finished','Discarded'].includes(x))return alert('Invalid status');if(x==='Reconstituted'&&v.status!=='Reconstituted'){let d=prompt('Reconstitution date YYYY-MM-DD:',iso(new Date()));if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Invalid date');v.date=d;let ml=prompt('Diluent volume in mL (optional):',v.ml||'');if(ml===null)return;if(ml!==''&&(!Number.isFinite(+ml)||+ml<0))return alert('Invalid volume');v.ml=+ml||0}v.events=v.events||[];v.events.push({at:nowLocal(),action:v.status+' → '+x});v.status=x;save();render()}
vials=function(){return heading('Vial Tracker · V2','Individual vial inventory, reconstitution history, remaining content and cycle status.')+`<div class="grid two"><div>${db.vials.map(v=>{let s=db.schedules.find(x=>x.id===v.scheduleId),used=spent(v),left=vialLeft(v),d=doseMg(s||{});return `<div class="card" style="margin-bottom:14px"><div class="row between"><h2>${esc(s?.name||'Unknown')} · ${esc(v.label||'Vial')}</h2><span class="v2pill">${esc(v.status)}</span></div><div class="v2grid"><div><strong>${fmt(left,3)} mg</strong><span class="muted small">Estimated remaining</span></div><div><strong>${fmt(used,3)} mg</strong><span class="muted small">Recorded as used</span></div><div><strong>${d?Math.floor(left/d):'—'}</strong><span class="muted small">Nominal doses left</span></div></div><p class="small muted">Original ${fmt(+v.mg,3)} mg · ${v.date?'Reconstituted '+esc(v.date):'No reconstitution date'} ${v.ml?'· '+fmt(+v.ml,2)+' mL':''}</p><div class="progress"><div style="width:${+v.mg?Math.max(0,Math.min(100,left/+v.mg*100)):0}%"></div></div><div class="btns" style="margin-top:12px"><button class="btn tiny" onclick="v2Status('${v.id}')">Update status</button><button class="btn tiny danger" onclick="delVial('${v.id}')">Delete</button></div><details><summary class="small muted">Vial history</summary>${(v.events||[]).map(e=>`<div class="small muted">${esc(e.at)} · ${esc(e.action)}</div>`).join('')}${db.logs.filter(l=>l.vialId===v.id&&l.status==='taken').map(l=>`<div class="small muted">${esc(l.actual||l.scheduledDate)} · ${fmt(+l.doseMg,3)} mg logged</div>`).join('')}</details></div>`}).join('')||'<div class="empty">No individual vials yet. Add one to start inventory tracking.</div>'}</div>${v2VialForm()}</div>`};
record=function(id,date,status){let s=db.schedules.find(x=>x.id===id);if(!s)return;const old=logFor(id,date);let actual='',site='',vialId='',amount=0;if(status==='taken'){actual=prompt('Actual date and time (YYYY-MM-DDTHH:MM):',old?.actual||nowLocal());if(actual===null)return;if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(actual))return alert('Invalid date/time');site=prompt('Administration site (optional):',old?.site||'');if(site===null)return;const vs=liveVials(id).filter(v=>vialLeft(v)>0||v.id===old?.vialId);if(!vs.length)return alert('No available vial is registered. Add a vial in Vials before logging a taken dose.');const choices=vs.map((v,i)=>`${i+1}. ${v.label||'Vial'} (${fmt(vialLeft(v),3)} mg left)`).join('\n');const chosen=prompt('Choose the vial used by entering its number:\n'+choices,String(Math.max(1,vs.findIndex(v=>v.id===old?.vialId)+1)));if(chosen===null)return;const v=vs[Number(chosen)-1];if(!v)return alert('Invalid vial selection');vialId=v.id;amount=doseMg(s);if(!(amount>0))return alert('Enter a valid dose in Settings first.');const available=vialLeft(v)+(old?.vialId===v.id&&old?.status==='taken'?+old.doseMg||0:0);if(amount>available+1e-8)return alert('This vial does not have enough recorded remaining content. Check inventory and dose entries.');}const l={id:old?.id||uid(),scheduleId:id,scheduledDate:date,name:s.name,status,actual,site,vialId,doseMg:amount,dose:s.dose,unit:s.unit,units:s.units};db.logs=db.logs.filter(x=>x.id!==old?.id);db.logs.push(l);save();render()};
stock=function(){return heading('Stock · V2','Live inventory from individual vials, automatically updated when you log or undo a dose.')+`<div class="grid two"><div>${db.schedules.map(s=>{const d=doseMg(s),vs=liveVials(s.id),mg=totalLeft(s.id),available=d?Math.floor(mg/d):0,need=futureNeed(s),short=Math.max(0,need-available),vialsNeeded=d&&vs.length?Math.ceil(Math.max(0,need*d-mg)/(+vs[0].mg||1)):'—';return `<div class="card" style="margin-bottom:14px"><div class="row between"><h2>${esc(s.name)}</h2><span class="chip ${!d?'warn':available>=need?'good':'bad'}">${!d?'Enter dose':available>=need?'✓ Nominal stock sufficient':'Stock shortfall'}</span></div><div class="v2grid"><div><strong>${fmt(mg,3)} mg</strong><span class="muted small">Usable recorded content</span></div><div><strong>${vs.filter(v=>v.status==='Unopened').length}</strong><span class="muted small">Unopened vials</span></div><div><strong>${vs.filter(v=>v.status==='Reconstituted').length}</strong><span class="muted small">Reconstituted vials</span></div><div><strong>${available}</strong><span class="muted small">Nominal doses available</span></div><div><strong>${need}</strong><span class="muted small">Future scheduled doses</span></div><div><strong>${short}</strong><span class="muted small">Dose shortfall</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${need?Math.min(100,available/need*100):100}%"></div></div><p class="small muted">${s.paused?'Cycle paused. ':''}Forecast through ${esc(s.end||dateAdd(iso(new Date()),29))}; uses the current entered dose and schedule. It excludes marked skipped doses and recorded completed doses.</p></div>`}).join('')||'<div class="empty">Add schedules first.</div>'}</div><div><div class="card"><h2>♡ Inventory by vial</h2>${db.vials.map(v=>`<div class="listrow row between"><div><strong>${esc(v.label||'Vial')}</strong><div class="small muted">${esc(db.schedules.find(s=>s.id===v.scheduleId)?.name||'Unknown')} · ${esc(v.status)}</div></div><strong>${fmt(vialLeft(v),3)} mg</strong></div>`).join('')||'<div class="empty">No vials yet.</div>'}<button class="btn lav" style="margin-top:12px" onclick="go('vials')">Manage vials →</button></div><div class="v2note">V2 stock uses individual vial records as the single source of truth. Old V1 bulk-stock entries are not counted, preventing double counting. Physical losses, stability, contamination, and dead space are not estimated. A nominally sufficient amount does not establish suitability for use.</div></div></div>`};
const oldHome=home;
home=function(){return oldHome()+`<div class="card" style="margin-top:16px"><div class="row between"><h2>♡ Vial & cycle overview</h2><button class="btn tiny" onclick="go('stock')">Stock →</button></div><div class="v2grid">${db.schedules.map(s=>`<div><strong>${esc(s.name)}</strong><div class="small muted">${fmt(totalLeft(s.id),2)} mg tracked · ${futureNeed(s)} future doses${s.paused?' · Paused':''}</div></div>`).join('')||'<div class="small muted">Add a schedule and vial to see your overview.</div>'}</div></div>`};
// V2 labels and fresh render
 document.title='petaldose';
render();
</script>

.title{color:#8e669d}.chip{border-radius:99px!important}
.flower-strip{font-size:18px;letter-spacing:10px;color:#c9a2df;margin:2px 0 12px;user-select:none}
.hello-card{background:linear-gradient(120deg,#ffebf5,#f0e7ff);border:1px solid #e9d4f0;border-radius:22px;padding:19px 22px;margin:12px 0 18px;box-shadow:0 5px 18px #b69ac61c;position:relative;overflow:hidden}
.hello-card:after{content:'✿ ♡ ✧';position:absolute;right:20px;top:13px;color:#caa5e4;font-size:30px;opacity:.75}
.hello-card h2{font-size:23px;color:#9166a5;margin:0 0 5px}.hello-card p{margin:0;color:#866b93}
.nick-field{max-width:370px}.nick-hint{color:#846d94;font-size:12px;margin-top:8px}
@media(max-width:600px){.hello-card:after{font-size:19px;right:8px}.brand{font-size:22px}}
</style>
<script>
// V3 presentation only; preserve V2 data namespace and inventory behavior.
if(!db.prefs || typeof db.prefs!=='object') db.prefs={};
function nickname(){return String(db.prefs.nickname||'lovely').trim()||'lovely'}
function updateNickname(e){e.preventDefault();let n=String(new FormData(e.target).get('nickname')||'').trim();if(n.length>40)return alert('Please use 40 characters or fewer.');db.prefs.nickname=n;save();render()}
const baseHomeV2=home;
home=function(){const greeting=`<div class="hello-card"><div class="flower-strip">✿ ♡ ✧ ❀ ♡</div><h2>Hi, ${esc(nickname())}! ♡</h2><p>your little corner for schedules, doses & dreamy organization ✧</p></div>`;return greeting+baseHomeV2().replace(/<h1 class="title">Hello, lovely! ♡<\/h1><p class="lead">Your soft little space for schedules, stock and tracking.<\/p>/,'')};
const baseSettingsV2=settings;
settings=function(){const html=baseSettingsV2();const nicknameCard=`<div class="card" style="margin-bottom:16px"><h2>♡ Make it yours</h2><p class="muted small">Choose the nickname shown on your home dashboard. Leave it blank to use “lovely”.</p><form onsubmit="updateNickname(event)" class="formgrid"><label class="field full nick-field">Your nickname<input name="nickname" maxlength="40" value="${esc(db.prefs.nickname||'')}" placeholder="e.g. princess, bunny, starshine"></label><button class="btn primary" type="submit">♡ Save nickname</button></form><div class="nick-hint">✿ Saved on this device and included in your JSON backups.</div></div>`;return nicknameCard+html};
document.title='petaldose';render();
</script>
</body></html>
